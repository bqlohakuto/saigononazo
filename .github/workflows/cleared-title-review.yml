name: Cleared title review
on:
  push:
    branches: [codex/post-clear-title-20261030]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/title-http.log 2>&1 &
      - run: node tests/cleared-title-review.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cleared-title-review
          path: artifacts/title-clear-review/
          retention-days: 7
