name: Eight-room critical-path regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'late-game.js'
      - 'room5.css'
      - 'index.html'
      - 'images/background/room05/overlays/**'
      - 'tests/room5-dining.test.cjs'
      - 'tests/room5-board-clue.test.cjs'
      - 'tests/room5-delayed-validation.test.cjs'
      - 'tests/room5-memory-entry.test.cjs'
      - 'tests/room5-mirror.test.cjs'
      - 'tests/room6-flow.test.cjs'
      - 'tests/room6-room7-deferred-events.test.cjs'
      - '.github/workflows/eight-room-regression.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'script.js'
      - 'inspection.js'
      - 'exploration-scenario.js'
      - 'room-exploration.js'
      - 'room-exploration.css'
      - 'scenario.js'
      - 'room2.js'
      - 'room3.js'
      - 'room4.js'
      - 'room4-scenario.js'
      - 'tests/room4-location-wording.test.cjs'
      - 'tests/room4-door-quotation.test.cjs'
      - 'tests/room4-first-pane-dialogue.test.cjs'
      - 'tests/room5-panel-reveal.test.cjs'
      - 'tests/room5-planter.test.cjs'
      - 'tests/room5-dining.test.cjs'
      - 'room4-scenario.js'
      - 'room5.js'
      - 'late-game.js'
      - 'room8-visuals.js'
      - 'design-ui.js'
      - 'design-ui.css'
      - 'style.css'
      - 'room5.css'
      - 'room6.css'
      - 'viewport-scaler.js'
      - 'browser-navigation.js'
      - 'browser-navigation.css'
      - 'tests/browser-navigation.test.cjs'
      - 'tests/room-passage.test.cjs'
      - 'tests/room-resume-timers.test.cjs'
      - 'tests/game-flow.test.cjs'
      - 'tests/answer-button-style.test.cjs'
      - 'tests/room6-intro-copy.test.cjs'
      - 'tests/room6-flow.test.cjs'
      - 'tests/room6-room7-deferred-events.test.cjs'
      - 'tests/room5-memory-entry.test.cjs'
      - 'tests/room3-editorial-143-151.test.cjs'
      - 'tests/room3-editorial-152-161.test.cjs'
      - 'tests/screen-transition-state.test.cjs'
      - 'images/background/**'
      - 'images/exhibits/**'
      - 'tests/critical-path.test.cjs'
      - 'tests/release-gates.test.cjs'
      - 'tests/room4-projection.test.cjs'
      - 'tests/room4-light-reset.test.cjs'
      - 'tests/room4-memory-fade.test.cjs'
      - 'tests/room8-flow.test.cjs'
      - 'tests/room8-resume-timers.test.cjs'
      - 'tests/room8-art.test.cjs'
      - 'tests/late-game-flow.test.cjs'
      - 'tests/final-clue-audit.test.cjs'
      - 'tests/save-data.test.cjs'
      - '.github/workflows/eight-room-regression.yml'

permissions:
  contents: read

jobs:
  eight-room:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DOM regression test dependency
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Check gameplay scripts and room entry/artwork completeness
        run: |
          for f in viewport-scaler.js browser-navigation.js script.js hana-choice.js inspection.js exploration-scenario.js room-exploration.js room2.js room3.js room4.js room8-visuals.js late-game.js design-ui.js; do node --check "$f"; done
          node --test tests/room6-intro-copy.test.cjs tests/answer-button-style.test.cjs tests/room-passage.test.cjs tests/room-resume-timers.test.cjs tests/browser-navigation.test.cjs tests/screen-transition-state.test.cjs tests/critical-path.test.cjs tests/release-gates.test.cjs tests/save-data.test.cjs tests/final-clue-audit.test.cjs tests/cache-version.test.cjs tests/room4-projection.test.cjs tests/room4-light-reset.test.cjs tests/room4-memory-fade.test.cjs tests/room4-location-wording.test.cjs tests/room4-door-quotation.test.cjs tests/room4-first-pane-dialogue.test.cjs tests/room5-panel-reveal.test.cjs tests/room5-planter.test.cjs tests/room5-dining.test.cjs tests/room5-board-clue.test.cjs tests/room5-delayed-validation.test.cjs tests/room5-memory-entry.test.cjs tests/room3-morse.test.cjs tests/room3-editorial-143-151.test.cjs tests/room3-editorial-152-161.test.cjs tests/room8-resume-timers.test.cjs tests/room6-room7-deferred-events.test.cjs tests/room2-choice-keyboard-focus.test.cjs tests/room2-compact-choice-panel.test.cjs
      - name: Test first room piano timer across save-slot switches
        run: node --test --test-name-pattern='H01:' tests/game-flow.test.cjs
      - name: Test room five puzzle through its transition
        run: node tests/room5-mirror.test.cjs
      - name: Test room six navigation and its transition
        run: node tests/room6-flow.test.cjs
      - name: Test room seven book puzzle and transition
        run: node tests/room7-flow.test.cjs
      - name: Test room eight, saved state, true name, and ending
        run: |
          node tests/room8-art.test.cjs
          node tests/room8-flow.test.cjs
      - name: Test the room six through ending critical path
        run: node tests/late-game-flow.test.cjs

