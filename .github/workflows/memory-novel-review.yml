name: Memory novel review

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/room01-memory-novel', 'codex/room02-memory-blazer', 'codex/memory-*']
    paths:
      - 'memory-visuals.js'
      - 'room3.js'
      - 'manual-save.js'
      - 'tests/room3-memory-resume*.cjs'
      - 'design-ui.js'
      - 'design-ui.css'
      - 'index.html'
      - 'images/background/memories/**'
      - 'images/characters/memories/**'
      - 'images/cg/memories/**'
      - 'images/items/memories/**'
      - 'tests/memory*.cjs'
      - '.github/workflows/memory-novel-review.yml'

permissions:
  contents: read

jobs:
  first-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Check dialogue and memory presentation rules
        run: node --test tests/memory-visuals.test.cjs tests/dialogue.test.cjs tests/cache-version.test.cjs tests/room3-memory-resume.test.cjs
      - name: Check Room 3 save and reload through manual slots
        run: node tests/room3-memory-resume.browser.cjs
      - name: Wait for the approved revision on GitHub Pages
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          files=(images/background/memories/room02/high-school-music-room.png index.html memory-visuals.js design-ui.js design-ui.css images/background/memories/room01/music-room.png images/background/memories/room01/walk-home.png images/characters/memories/room01/girl-approved.png images/characters/memories/room02/girl-blazer.png)
          for attempt in $(seq 1 24); do
            ready=1
            for file in "${files[@]}"; do
              if ! curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://bqlohakuto.github.io/saigononazo/$file?verify=$GITHUB_SHA-$attempt" -o /tmp/memory-published-file; then
                ready=0
                break
              fi
              if ! cmp -s "$file" /tmp/memory-published-file; then
                echo "Waiting for published $file ($attempt/24)"
                ready=0
                break
              fi
            done
            if [ "$ready" = 1 ]; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Review piano, recollection and return on desktop and landscape Safari engine
        env:
          UI_SCREENSHOT_DIR: artifacts/memory-novel
          PUBLIC_BASE_URL: ${{ github.ref == 'refs/heads/main' && 'https://bqlohakuto.github.io/saigononazo/' || '' }}
        run: node tests/memory-novel.browser.cjs
      - name: Review the second recollection directly on desktop and landscape Safari engine
        env:
          UI_SCREENSHOT_DIR: artifacts/memory-novel
          PUBLIC_BASE_URL: ${{ github.ref == 'refs/heads/main' && 'https://bqlohakuto.github.io/saigononazo/' || '' }}
        run: node tests/memory02-novel.browser.cjs
      - name: Review recollections 2 through 7 and narration continuity
        env:
          UI_SCREENSHOT_DIR: artifacts/memory-novel/all-rooms
          PUBLIC_BASE_URL: ${{ github.ref == 'refs/heads/main' && 'https://bqlohakuto.github.io/saigononazo/' || '' }}
        run: node tests/memory-all-novel.browser.cjs
      - name: Review Room 5 window portraits, drawing and revised dialogue
        env:
          UI_SCREENSHOT_DIR: artifacts/memory-novel/room05-window
          PUBLIC_BASE_URL: ${{ github.ref == 'refs/heads/main' && 'https://bqlohakuto.github.io/saigononazo/' || '' }}
        run: node tests/memory05-window.browser.cjs
      - name: Review Room 6 scale, travel and map in the integrated game
        env:
          PUBLIC_BASE_URL: ${{ github.ref == 'refs/heads/main' && 'https://bqlohakuto.github.io/saigononazo/' || '' }}
        run: node tests/room6-visual.browser.cjs
      - name: Keep review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-memory-desktop-and-landscape
          path: |
            artifacts/memory-novel/
            artifacts/room06/
          if-no-files-found: warn
          retention-days: 14
