name: Public Chrome desktop and landscape smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-opening-chrome.yml'
      - 'tests/public-opening.browser.cjs'

permissions:
  contents: read

jobs:
  chrome-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use runner Chrome for browser checks
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          if ! command -v google-chrome >/dev/null; then
            npx playwright install chromium
            echo "No system Chrome on runner" >&2
            exit 1
          fi
          google-chrome --version
      - name: Wait for published code
        run: |
          for i in $(seq 1 40); do
            ready=1
            for f in index.html script.js design-ui.js design-ui.css opening-sequence.js; do
              curl -fsSL --max-time 20 "https://bqlohakuto.github.io/saigononazo/$f?verify=$GITHUB_SHA-$i" -o "/tmp/chrome-$(basename $f)" || ready=0
              expected=$(sha256sum "$f" | cut -d ' ' -f 1)
              echo "$expected  /tmp/chrome-$(basename $f)" | sha256sum -c - || ready=0
            done
            if [ "$ready" = 1 ]; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Verify desktop and mobile landscape on published page
        env:
          PUBLIC_BASE_URL: https://bqlohakuto.github.io/saigononazo/
          PUBLIC_SMOKE_CHROMIUM_ONLY: '1'
          UI_SCREENSHOT_DIR: artifacts/public-opening
        run: node tests/public-opening.browser.cjs
      - name: Upload visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-opening-chrome
          path: artifacts/public-opening/
          retention-days: 14
          if-no-files-found: warn
