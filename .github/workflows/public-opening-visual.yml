name: Published opening visual smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-opening-visual.yml'
      - 'tests/public-opening.browser.cjs'
      - 'opening-sequence.js'
      - 'design-ui.css'
      - 'script.js'
      - 'index.html'
      - 'images/pixel-ui/**'
      - 'images/background/room01/pixel/**'

permissions:
  contents: read

jobs:
  public-opening:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Wait for GitHub Pages to serve this revision
        shell: bash
        run: |
          expected=$(sed -n 's/.*design-ui[.]css?v=\([^"]*\)".*/\1/p' index.html | head -n 1)
          test -n "$expected"
          for attempt in $(seq 1 24); do
            html=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://bqlohakuto.github.io/saigononazo/?verify=$GITHUB_SHA-$attempt" || true)
            if [[ "$html" == *"design-ui.css?v=$expected"* ]]; then
              echo "GitHub Pages is serving the expected CSS revision: $expected"
              exit 0
            fi
            echo "Waiting for Pages revision ($attempt/24)"
            sleep 10
          done
          echo "GitHub Pages was not updated before the visual check deadline." >&2
          exit 1
      - name: Check published desktop and landscape-mobile opening
        env:
          PUBLIC_BASE_URL: https://bqlohakuto.github.io/saigononazo/
          UI_SCREENSHOT_DIR: artifacts/public-opening
        run: node tests/public-opening.browser.cjs
      - name: Keep screenshots even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-opening-desktop-mobile
          path: artifacts/public-opening/
          if-no-files-found: warn
          retention-days: 14
