name: Public release readiness and portable ZIP

on:
  workflow_dispatch:
  # Generate a large release artifact only for intentional releases, not every
  # working commit while polishing artwork and dialogue.
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DOM dependency for story progression
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Check first-to-final assets, save data, sound and credits
        run: |
          node --test tests/critical-path.test.cjs tests/cache-version.test.cjs tests/room8-art.test.cjs tests/ending-credits.test.cjs tests/game-audio.test.cjs tests/save-data.test.cjs tests/hardening.test.cjs tests/puzzle-guide-unlock.test.cjs
          node tests/room8-flow.test.cjs
      - name: Build portable game-only ZIP with explicit asset audit
        run: python3 scripts/build_release.py dist/saigononazo-web.zip
      - name: Preserve reviewed candidate package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: saigononazo-release-candidate
          path: dist/saigononazo-web.zip
          retention-days: 7
          if-no-files-found: error
