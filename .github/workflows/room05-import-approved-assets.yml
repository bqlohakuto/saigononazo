name: Import approved Room 05 art
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      approved_zip_url:
        description: GitHub-hosted URL for approved ZIP
        required: true
        type: string
permissions:
  contents: write
  issues: read
concurrency:
  group: room05-approved-art-import
  cancel-in-progress: false
jobs:
  import-room05-art:
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 19 &&
       github.event.comment.user.login == 'bqlohakuto') ||
      (github.event_name == 'workflow_dispatch' &&
       github.actor == 'bqlohakuto')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Identify official GitHub attachment
        id: attachment
        env:
          ROOM05_COMMENT: ${{ github.event.comment.body }}
          ROOM05_INPUT_URL: ${{ inputs.approved_zip_url }}
        run: |
          python3 - <<'PY'
          import os, re
          from urllib.parse import urlparse
          body=os.getenv("ROOM05_INPUT_URL") or os.getenv("ROOM05_COMMENT") or ""
          urls=re.findall(r"https://github[.]com/user-attachments/(?:assets|files)/[A-Za-z0-9._~!$&'()*+,;=:@%/\-]+",body)
          if not urls: raise SystemExit("Attach room05-ready-for-github.zip to Issue 19 and post your comment.")
          url=urls[0].rstrip(").,;")
          parsed=urlparse(url)
          if parsed.scheme!="https" or parsed.hostname!="github.com" or not parsed.path.startswith("/user-attachments/"):
              raise SystemExit("Unsupported attachment origin")
          with open(os.environ["GITHUB_OUTPUT"],"a") as f: f.write("url="+url+"\n")
          PY
      - name: Download and check approved archive
        env:
          SOURCE_URL: ${{ steps.attachment.outputs.url }}
        run: |
          curl --fail --location --silent --show-error --retry 3 --max-time 120 --max-filesize 8000000 "$SOURCE_URL" --output /tmp/room05.zip
          echo 'cf2225d80b61d89f91ecb36e77e342baf94945c52d7387b756cc513c131ce940  /tmp/room05.zip' | sha256sum -c -
      - name: Validate and extract exactly the expected images
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          with zipfile.ZipFile("/tmp/room05.zip") as z:
              names=z.namelist()
              entries=json.loads(z.read("manifest.json"))
              paths={entry["path"]:entry for entry in entries}
              if len(paths)!=21 or len(entries)!=21 or set(names)!=set(paths)|{"manifest.json","README.md"}:
                  raise SystemExit("Unexpected archive contents")
              for name,entry in paths.items():
                  if not name.startswith("images/background/room05/") or not name.endswith(".webp") or ".." in pathlib.PurePosixPath(name).parts:
                      raise SystemExit("Unexpected asset path")
                  data=z.read(name)
                  if len(data)!=entry["bytes"] or hashlib.sha256(data).hexdigest()!=entry["sha256"]:
                      raise SystemExit("Image checksum mismatch: "+name)
                  target=pathlib.Path(name)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(data)
              print("Extracted",len(paths),"approved Room 05 images")
          PY
      - name: Commit only the imported images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/background/room05/
          if git diff --cached --quiet; then echo "Art is already present"; exit 0; fi
          git commit -m "Add approved Room 05 backgrounds and item panels"
          git push origin HEAD:main
