name: Room 05 published artwork review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'images/background/room05/**'
      - 'room5.css'
      - 'late-game.js'
      - 'tests/room5-visual.browser.cjs'
      - '.github/workflows/room05-published-review.yml'
permissions:
  contents: read
jobs:
  review-room05:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Wait for the official image published on Pages
        run: |
          expected_html=$(sha256sum index.html | cut -d ' ' -f 1)
          expected_css=$(sha256sum room5.css | cut -d ' ' -f 1)
          for i in $(seq 1 35); do
            curl -fsSL --max-time 20 "https://bqlohakuto.github.io/saigononazo/index.html?verify=$GITHUB_SHA-$i" -o /tmp/r5-index.html || true
            curl -fsSL --max-time 20 "https://bqlohakuto.github.io/saigononazo/room5.css?verify=$GITHUB_SHA-$i" -o /tmp/r5-style.css || true
            if ! echo "$expected_html  /tmp/r5-index.html" | sha256sum -c - || ! echo "$expected_css  /tmp/r5-style.css" | sha256sum -c -; then
              sleep 10
              continue
            fi
            data=$(curl -sSL --max-time 20 -H 'Cache-Control: no-cache' -o /tmp/r5-front.webp -w '%{http_code}' "https://bqlohakuto.github.io/saigononazo/images/background/room05/front.webp?verify=$GITHUB_SHA-$i" || true)
            if [ "$data" = 200 ]; then
              if echo '33c1cdb56abb196dbb638ba28c906141aab4231f78040f5f1d19c3b5c1d44842  /tmp/r5-front.webp' | sha256sum -c -; then exit 0; fi
            fi
            sleep 10
          done
          echo 'Room 05 original image not served by Pages' >&2
          exit 1
      - name: Test all scene images and snapshots on desktop/landscape
        env:
          PUBLIC_BASE_URL: https://bqlohakuto.github.io/saigononazo/
        run: node tests/room5-visual.browser.cjs
      - name: Upload visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room05-actual-art-review
          path: artifacts/room05/
          if-no-files-found: warn
          retention-days: 14
