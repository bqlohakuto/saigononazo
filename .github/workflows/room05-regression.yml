name: Room 05 exploration and puzzle regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'room5.js'
      - 'room5.css'
      - 'late-game.js'
      - 'late-game.css'
      - 'script.js'
      - 'tests/room5-mirror.test.cjs'
      - '.github/workflows/room05-regression.yml'
permissions:
  contents: read
jobs:
  room5:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DOM test dependency
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Syntax check
        run: |
          node --check room5.js
          node --check late-game.js
      - name: Test seventh-panel completion, 8194, flashback and save
        run: node tests/room5-mirror.test.cjs
