name: Room 07 library review
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/room7-boar-2007-preview']
    paths: ['index.html', 'manifest.webmanifest', 'late-game.js', 'design-ui.js', 'design-ui.css', 'images/background/room07/**', 'images/items/room07/**', 'tests/room6-flow.test.cjs', 'tests/late-game-flow.test.cjs', 'tests/room7*', 'tests/room8*', 'tests/mobile-display*', '.github/workflows/room07-review.yml']
permissions:
  contents: read
jobs:
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock jsdom@26 playwright@1.56.1
      - run: node --test tests/cache-version.test.cjs tests/memory-visuals.test.cjs tests/room6-logic.test.cjs tests/room6-memory.test.cjs tests/game-log.test.cjs
      - run: node tests/room7-flow.test.cjs
      - run: node tests/room8-flow.test.cjs
      - run: node tests/late-game-flow.test.cjs
      - run: node tests/room6-flow.test.cjs
      - run: npx playwright install chromium
      - run: node tests/room7-visual.browser.cjs
      - run: node tests/room8-visual.browser.cjs
      - run: node tests/mobile-display.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room07-PC-mobile-review
          path: artifacts/room07/
          retention-days: 14
