name: Room 07 monkey quick visual review
on:
  push:
    branches: ['codex/room7-monkey-2016-preview']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install chromium
      - run: node tests/r7-monkey-quick-preview.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monkey-quick-review
          path: artifacts/monkey-quick/
          retention-days: 2
