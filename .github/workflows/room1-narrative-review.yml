name: Room 1 narrative refinement review

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scenario.js'
      - 'SCENARIO.md'
      - 'scenario/01_room1.md'
      - 'tests/room1-narrative-refinement.test.cjs'
      - 'tests/scenario-doc-sync.test.cjs'
      - 'tests/hana-dialogue-save.test.cjs'
      - '.github/workflows/room1-narrative-review.yml'

permissions:
  contents: read

jobs:
  room1-source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check approved dialogue, source manuscripts and save-independent topic choices
        run: |
          node --check scenario.js
          node --test tests/room1-narrative-refinement.test.cjs tests/scenario-doc-sync.test.cjs tests/hana-dialogue-save.test.cjs
