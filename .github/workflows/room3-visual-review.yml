name: Review room 3 four directions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'room3.js'
      - 'exploration-scenario.js'
      - 'images/items/optional-room03-lecture-notebook.svg'
      - 'style.css'
      - 'design-ui.css'
      - 'index.html'
      - 'images/background/room03/**'
      - 'tests/room3-visual.browser.cjs'
      - '.github/workflows/room3-visual-review.yml'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps webkit
          google-chrome --version
      - run: node tests/room3-visual.browser.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room03-review
          path: artifacts/room03/
          retention-days: 14
