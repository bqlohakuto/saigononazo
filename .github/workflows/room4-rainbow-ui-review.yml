name: Room 04 rainbow tactile UI review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'room4.js'
      - 'design-ui.css'
      - 'tests/room4-rainbow.browser.cjs'
      - '.github/workflows/room4-rainbow-ui-review.yml'
permissions:
  contents: read
jobs:
  rainbow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check puzzle and test syntax
        run: |
          node --check room4.js
          node --check tests/room4-rainbow.browser.cjs
      - name: Test draggable plates and short landscape display
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/r4-rainbow-server.log 2>&1 &
          BASE_URL=http://127.0.0.1:8765 ARTIFACT_DIR=artifacts/rainbow-review node tests/room4-rainbow.browser.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room04-rainbow-review
          path: artifacts/rainbow-review/
          retention-days: 10
