name: Room 5 keypad display regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'late-game.js'
      - 'design-ui.css'
      - 'index.html'
      - 'tests/room5-keypad-visual.browser.cjs'
      - '.github/workflows/room5-keypad-review.yml'

permissions:
  contents: read

jobs:
  keypad:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browsers
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps webkit
          google-chrome --version
      - name: Check keypad in desktop Chrome and iPhone WebKit
        env:
          UI_SCREENSHOT_DIR: artifacts/room05-keypad
        run: node tests/room5-keypad-visual.browser.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room05-keypad-review
          path: artifacts/room05-keypad/
          if-no-files-found: warn
          retention-days: 14
