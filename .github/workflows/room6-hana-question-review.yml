name: Room 6 optional Hana dialogue

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'late-game.js'
      - 'scenario/06_room6.md'
      - 'scenario/FULL_SCENARIO.md'
      - 'SCENARIO.md'
      - 'index.html'
      - 'tests/room6-hana-question.test.cjs'
      - '.github/workflows/room6-hana-question-review.yml'

permissions:
  contents: read

jobs:
  room6-hana:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DOM test dependency
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Verify the optional story topic and Room 6 puzzle compatibility
        run: |
          node --check late-game.js
          node --test tests/room6-hana-question.test.cjs tests/room6-logic.test.cjs tests/room6-memory.test.cjs tests/cache-version.test.cjs
