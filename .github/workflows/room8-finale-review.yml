name: Room 8 finale checks
on:
  pull_request:
    paths:
      - 'late-game.js'
      - 'tests/room8-finale-emotions.test.cjs'
      - '.github/workflows/room8-finale-review.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/room8-finale-emotions.test.cjs
